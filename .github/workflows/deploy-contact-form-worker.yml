name: Deploy Contact Form Worker

on:
  push:
    branches:
      - main
    paths:
      - 'workers/contact-form/**'
      - 'workers/shared/**'
      - '.github/workflows/deploy-contact-form-worker.yml'
  workflow_dispatch: # Allows manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Contact Form Worker to Cloudflare
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: workers/contact-form
        run: npm install

      - name: Deploy to Cloudflare Workers
        working-directory: workers/contact-form
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@3 deploy
