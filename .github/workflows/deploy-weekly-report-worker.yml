name: Deploy Weekly Report Worker

on:
  push:
    branches:
      - main
    paths:
      - 'workers/weekly-report/**'
      - 'workers/shared/**'
      - '.github/workflows/deploy-weekly-report-worker.yml'
  workflow_dispatch: # Allows manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Weekly Report Worker to Cloudflare
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: workers/weekly-report
        run: npm install

      - name: Deploy to Cloudflare Workers
        working-directory: workers/weekly-report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@3 deploy
