# Cloudflare Worker - Analytics Event Handler
name = "referral-analytics"
main = "index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
account_id = "45d1e1be26c9a77b911d7b5b0225945a"

# Bind D1 database
[[d1_databases]]
binding = "DB"
database_name = "referral-analytics-db"
database_id = "50aa2341-12ad-406d-8905-f40b398c8dc0"

# Email sending binding (Cloudflare Email Workers)
[[send_email]]
name = "EMAIL"
destination_address = "pixelandcodestudios@gmail.com"

# KV namespace for rate limiting
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "4f49c4fb202f4f25be8a1c1adbe80665"
preview_id = "040940f91bf64ca8bfc34e5024d9bbd3"

# Environment variables
[vars]
FROM_EMAIL = "notifications@pcs-hub.com"
FROM_NAME = "Referral Network Notifications"
