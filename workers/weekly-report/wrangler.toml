# Cloudflare Worker - Weekly Report (Scheduled)
name = "referral-weekly-report"
main = "index.js"
compatibility_date = "2024-01-01"

# Bind D1 database (same as analytics worker)
[[d1_databases]]
binding = "DB"
database_name = "referral-analytics-db"
database_id = "50aa2341-12ad-406d-8905-f40b398c8dc0"

# Cron trigger: Disabled due to account limit
# You can trigger manually via HTTP POST or upgrade to Workers Paid for more crons
# [triggers]
# crons = ["0 11 * * 2"]

# Environment variables
[vars]
FROM_EMAIL = "reports@referralnetwork.com"
FROM_NAME = "Referral Network Analytics"
